version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-houston-foundation
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_TUNNEL_URL=http://localhost:5678/
      - GENERIC_TEMP_DIR=/home/node/.n8n/temp
      - TZ=America/Chicago
      # PostgreSQL Configuration (optional - comment out for SQLite)
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_PORT=5432
      # - DB_POSTGRESDB_DATABASE=n8n
      # - DB_POSTGRESDB_USER=n8n
      # - DB_POSTGRESDB_PASSWORD=change_this_password
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/.n8n/workflows
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Uncomment below if using PostgreSQL
    # depends_on:
    #   - postgres
    # networks:
    #   - n8n-network

  # PostgreSQL Database (Optional - for production use)
  # Uncomment all postgres section lines to enable
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: n8n-postgres
  #   environment:
  #     POSTGRES_DB: n8n
  #     POSTGRES_USER: n8n
  #     POSTGRES_PASSWORD: change_this_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - n8n-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U n8n"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  n8n_data:
    driver: local
  # postgres_data:  # Uncomment if using PostgreSQL

# networks:  # Uncomment if using PostgreSQL
#   n8n-network:
#     driver: bridge
